<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff6eae">
<title>Street Coins V21</title>
<link rel="manifest" href="manifest.webmanifest?v=21">
<link rel="icon" href="coin.svg?v=21" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css?v=21">
<style>
#appVersion{position:absolute;z-index:9999;left:10px;bottom:max(12px,env(safe-area-inset-bottom));padding:6px 10px;border:2px solid #553047;border-radius:12px;background:#fff8fc;color:#553047;font:900 11px "Trebuchet MS",sans-serif;box-shadow:0 3px 0 #553047;pointer-events:none}
</style>
</head>
<body>
<main id="app">
<div id="map" aria-label="Mappa di gioco"></div>
<header class="hud">
<div class="brand"><span class="brand-coin">✦</span><span>STREET COINS</span></div>
<div class="counter"><span class="counter-icon">🪙</span><span id="coinCount">0</span><small>MONETE</small></div>
</header>
<section class="status" id="status" role="status">Attiva il GPS per iniziare.</section>
<button id="recenterBtn" class="recenter-control" title="Ricentra sulla mia posizione" aria-label="Ricentra sulla mia posizione" disabled>⌖</button>
<div class="controls">
<button id="locateBtn" class="primary">◎ Attiva GPS</button>
<button id="accountBtn" class="account">Accedi</button>
<button id="bonusBtn" class="bonus" disabled><span>✦</span><small>BONUS <b id="bonusCount">1</b></small></button>
<button id="refreshBtn" class="secondary" title="Cerca di nuovo le strade">↻</button>
</div>
<div id="appVersion">V21</div>
<div id="authPanel" class="modal hidden"><div class="dialog"><button id="authClose" class="close">×</button><h2>Account</h2><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="login" class="primary">Accedi</button><button id="signup" class="secondary">Crea account</button><p id="authMsg"></p></div></div>
<div id="adminPanel" class="modal hidden"><div class="dialog admin"><button id="adminClose" class="close" aria-label="Chiudi">×</button><h2>Pannello amministratore</h2><p id="adminMsg"></p><button id="seedCoins" class="primary">Crea 100 monete fisse a Trento</button><div id="coinList"></div><button id="adminBack" class="secondary back-button">← Torna alla mappa</button></div></div>
<div id="victoryPanel" class="modal hidden victory-modal"><div class="dialog victory-dialog"><div id="fireworks" class="fireworks"></div><div class="victory-emoji">🏆</div><h1>MONETA TROVATA!</h1><img id="victoryImage" class="victory-image hidden" alt="Immagine della moneta"><h2 id="victoryTitle"></h2><p id="victoryDescription"></p><button id="victoryNext" class="primary">Avanti</button></div></div>
<div class="bottom-note" id="bottomNote">GPS necessario · Monete sulle strade reali</div>
<div class="toast" id="toast" aria-live="polite"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=21"></script>
</body>
</html>
