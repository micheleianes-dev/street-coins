<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff6eae">
<title>Street Coins V8</title>
<link rel="manifest" href="manifest.webmanifest?v=8">
<link rel="icon" href="coin.svg?v=8" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css?v=8">
<style>
#appVersion{position:absolute;z-index:9999;left:10px;bottom:max(12px,env(safe-area-inset-bottom));padding:6px 10px;border:2px solid #553047;border-radius:12px;background:#fff8fc;color:#553047;font:900 11px "Trebuchet MS",sans-serif;box-shadow:0 3px 0 #553047;pointer-events:none}
</style>
</head>
<body>
<main id="app">
<div id="map" aria-label="Mappa di gioco"></div>
<header class="hud">
<div class="brand"><span class="brand-coin">✦</span><span>STREET COINS</span></div>
<div class="counter"><span class="counter-icon">🪙</span><span id="coinCount">0</span><small>MONETE</small></div>
</header>
<section class="status" id="status" role="status">Attiva GPS per trovare le monete nella tua zona.</section>
<div class="controls">
<button id="locateBtn" class="primary">◎ Attiva GPS</button>
<button id="bonusBtn" class="bonus" disabled><span>✦</span><small>BONUS <b id="bonusCount">1</b></small></button>
<button id="refreshBtn" class="secondary" title="Carica monete nell'area visibile">↻</button>
</div>
<div id="appVersion">V8</div>
<div class="bottom-note" id="bottomNote">Monete rosa posizionate sulle strade</div>
<div class="toast" id="toast" aria-live="polite"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
